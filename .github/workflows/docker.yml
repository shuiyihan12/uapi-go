name: Docker

# Build the multi-stage image and push it to Docker Hub.
# Requires repo secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# Version tags use the `v0.WSDL.PATCH` scheme documented in docs/CHANGELOG.md
# (WSDL = Travelport contract version, PATCH = our own fix number), e.g. `v0.55.1`.
# Major is pinned at 0, so no `/vN` module path suffix is required.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: uapi-go

jobs:
  image:
    name: Build and push image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags:
      #   - main -> latest + <sha>
      #   - v*.* -> latest + <sha> + <tag> (e.g. v0.55.1)
      # NOTE: build-push-action expects the tag list newline/comma separated,
      # not space separated (space makes it one invalid reference).
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          tags=("${REPO}:latest" "${REPO}:${GITHUB_SHA::8}")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags+=("${REPO}:${GITHUB_REF_NAME}")
          fi
          {
            echo "tags<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
