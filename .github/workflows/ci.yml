name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run full pipeline (deps + generate + build + test + lint)
        run: ./scripts/build.sh all

      # build.sh all regenerates pkg/generated from wsdl/ before building;
      # a non-empty diff means the committed generated code is out of sync
      # with the archived contracts or the generator.
      - name: Verify generated code is in sync with wsdl/ contracts
        run: |
          git diff --exit-code -- pkg/generated/ || {
            echo "::error::pkg/generated is out of date. Run ./scripts/build.sh wsdl and commit the result."
            exit 1
          }
