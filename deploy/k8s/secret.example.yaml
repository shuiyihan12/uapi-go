# Example credentials for the /health upstream probe (used by readinessProbe).
#
# Usage: replace the placeholder below with a real Travelport auth header and run
#   kubectl apply -f secret.example.yaml
# or, preferably (avoiding credentials on disk):
#   kubectl create secret generic uapi-go-health \
#     --from-literal=authorization='Basic xxxx' -n <namespace>
#
# Note: these are probe-only credentials (the gateway process's own deployment
# config), distinct from the per-request Authorization that business callers
# send; use a read-only / low-privilege account and rotate it regularly.
apiVersion: v1
kind: Secret
metadata:
  name: uapi-go-health
type: Opaque
stringData:
  authorization: "Basic REPLACE_ME"
